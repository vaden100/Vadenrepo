name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Brand assets in sync
        run: pnpm brand:check
      - name: Copy rules
        run: pnpm copy:check
      - name: Build web, mobile (JS bundles) and worker
        run: pnpm build

  db-and-security:
    # SPEC 16 Phase 1 acceptance: pgTAP RLS/audit suite + end-to-end ban/rate-limit test.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Postgres 16, pgvector, pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgvector postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl stop postgresql || true
      - run: pnpm install --frozen-lockfile
      - name: Database tests (pgTAP)
        run: pnpm test:db
      - name: End-to-end security (Postgres + PostgREST + next start)
        run: pnpm test:e2e:security
        env:
          E2E_REBUILD: '1'

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (SPEC 11)
        run: pnpm audit --prod --audit-level high
