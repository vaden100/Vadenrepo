name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Brand assets in sync
        run: pnpm brand:check
      - name: Copy rules
        run: pnpm copy:check
      - name: Build web, mobile (JS bundles) and worker
        run: pnpm build

  db-and-security:
    # SPEC 16 Phase 1 + 2 acceptance: pgTAP suite, end-to-end bans/rate limits/audit, and an
    # anonymous report through the real UI (2 images + voice note) processed by the worker.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Postgres 16, pgvector, pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgvector postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl ffmpeg
          sudo systemctl stop postgresql || true
      - run: pnpm install --frozen-lockfile
      - name: Database tests (pgTAP)
        run: pnpm test:db
      - name: Playwright Chromium
        run: pnpm --filter @rmmm/web exec playwright install --with-deps chromium
      - name: End-to-end stack (Postgres + PostgREST + next start + worker + browser)
        run: pnpm test:e2e:security
        env:
          E2E_REBUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stack-traces
          path: apps/web/test-results

  browser:
    # WBS 95 to 98: Playwright journeys, axe (both themes), keyboard, responsive, visual, perf.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rmmm/web exec playwright install --with-deps chromium
      - run: pnpm --filter @rmmm/web build:e2e
      - run: pnpm --filter @rmmm/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  browser-cross:
    # WBS 47: the same journeys on Firefox and WebKit (Safari engine). Non-blocking until the
    # first green run on CI, since only Chromium was available where the suite was written.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rmmm/web exec playwright install --with-deps firefox webkit
      - run: pnpm --filter @rmmm/web build:e2e
      - run: pnpm --filter @rmmm/web exec playwright test --project=firefox --project=webkit
        env:
          PW_ALL_BROWSERS: '1'

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (SPEC 11)
        run: pnpm audit --prod --audit-level high
