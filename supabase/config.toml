# Supabase CLI config for local development (`supabase start`). Production settings
# (SMTP, SMS provider, captcha secret, redirect URLs) are set in the Supabase dashboard.
project_id = "run-me-my-money"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["rmmm://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[auth.sms]
enable_signup = true
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

# SPEC 11: staff need TOTP. Policies require aal2 for every staff privilege.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
